<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>咪菲認字小花園</title>
    <meta name="theme-color" content="#3f8f69" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="咪菲認字小花園" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">普通話 · 繁體認字</p>
          <h1 id="app-title">咪菲認字小花園</h1>
        </div>
        <button class="icon-button" id="sound-toggle" type="button" aria-label="開關聲音">
          🔊
        </button>
        <div class="auth-panel">
          <span class="auth-status" id="auth-status">未登入</span>
          <button class="small-button" id="login-button" type="button">Google 登入</button>
          <button class="ghost-button" id="logout-button" type="button" hidden>登出</button>
          <p class="auth-message" id="auth-message"></p>
        </div>
      </header>

      <nav class="app-nav" aria-label="主要頁面">
        <button class="nav-button active" type="button" data-page="practice">練習</button>
        <button class="nav-button" type="button" data-page="rewards">本週集點</button>
        <button class="nav-button" type="button" data-page="parent">家長</button>
      </nav>

      <section class="learning-panel app-page active" data-page-panel="practice" aria-labelledby="app-title">
        <header class="topbar">
          <div>
            <p class="eyebrow">今日任務</p>
            <h2>完成 20 題拿 1 顆星</h2>
          </div>
          <p class="today-stars" id="today-stars">0 / 3 ⭐</p>
        </header>

        <section class="practice-controls" aria-label="練習設定">
          <label>
            <span>小孩</span>
            <select id="practice-profile-select"></select>
          </label>
          <label>
            <span>課程</span>
            <select id="practice-course-select"></select>
          </label>
        </section>

        <nav class="mode-tabs" aria-label="練習模式">
          <button class="tab active" type="button" data-mode="listen">聽音選字</button>
        </nav>

        <section class="prompt-area" aria-live="polite">
          <p class="round-label" id="round-label">第 1 題</p>
          <div class="main-card">
            <p class="instruction" id="instruction">聽一聽，選出你聽到的字。</p>
            <button class="speak-button" id="speak-button" type="button">
              <span aria-hidden="true">▶</span>
              再聽一次
            </button>
            <div class="picture-prompt" id="picture-prompt" hidden></div>
            <div class="character-prompt" id="character-prompt" hidden></div>
          </div>
        </section>

        <section class="choice-grid" id="choice-grid" aria-label="答案選項"></section>

        <footer class="progress-row">
          <div>
            <p class="mini-label">本輪答對</p>
            <p class="score" id="score">0</p>
          </div>
          <div class="progress-track" aria-label="本輪進度">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <button class="secondary-button" id="next-button" type="button" disabled>下一題</button>
        </footer>
      </section>

      <section class="reward-panel app-page" data-page-panel="rewards" aria-labelledby="reward-title" hidden>
        <div class="reward-hero">
          <p class="eyebrow">一週任務</p>
          <h2 id="reward-title">每天最多 3 顆星星</h2>
          <p>每完成 20 題得到 1 顆星。每個小孩的集點會分開記錄。</p>
        </div>
        <section class="practice-controls reward-controls" aria-label="集點設定">
          <label>
            <span>小孩</span>
            <select id="reward-profile-select"></select>
          </label>
        </section>
        <div class="week-grid" id="week-grid" aria-label="本週集點"></div>
      </section>

      <section class="parent-panel app-page" data-page-panel="parent" aria-labelledby="parent-title" hidden>
        <details class="parent-details" open>
          <summary id="parent-title">家長管理</summary>
          <div class="parent-hero">
            <div>
              <p class="eyebrow">課程設定</p>
              <h2>管理字詞組</h2>
              <p class="parent-note">最多 10 組。每組可以放樂樂書一課，或一週想複習的字。</p>
            </div>
            <div class="stats">
              <div>
                <span class="stat-number" id="known-count">0</span>
                <span class="stat-label">答對</span>
              </div>
              <div>
                <span class="stat-number" id="practice-count">0</span>
                <span class="stat-label">已練</span>
              </div>
            </div>
          </div>

          <section class="group-manager" aria-labelledby="group-title">
            <div class="manager-card profile-card">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">小孩 Profile</p>
                  <h2>學習記錄</h2>
                </div>
                <button class="small-button" id="add-profile-button" type="button">新增小孩</button>
              </div>
              <div class="profile-tabs" id="profile-tabs" aria-label="小孩清單"></div>
              <label class="field-label" for="profile-name">小孩名稱</label>
              <input
                class="text-field"
                id="profile-name"
                type="text"
                maxlength="18"
                placeholder="例如：咪菲"
              />
              <div class="manager-actions compact-actions">
                <button class="secondary-button" id="save-profile-button" type="button">儲存小孩</button>
                <button class="ghost-button" id="delete-profile-button" type="button">刪除</button>
              </div>
            </div>

            <div class="manager-card course-card">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">選擇課程</p>
                  <h2 id="group-title">字詞組</h2>
                </div>
                <button class="small-button" id="add-group-button" type="button">新增</button>
              </div>
              <div class="group-tabs" id="group-tabs" aria-label="字詞組清單"></div>
            </div>

            <div class="manager-grid">
              <div class="manager-card editor-card">
                <div class="section-heading">
                  <div>
                    <p class="eyebrow">編輯</p>
                    <h2>課程內容</h2>
                  </div>
                  <span class="group-count" id="group-count">0 / 10</span>
                </div>

                <label class="field-label" for="group-name">課程名稱</label>
                <input
                  class="text-field"
                  id="group-name"
                  type="text"
                  maxlength="18"
                  placeholder="例如：樂樂書第一課"
                />

                <label class="field-label" for="word-editor">字詞</label>
                <textarea
                  class="word-editor"
                  id="word-editor"
                  rows="8"
                  spellcheck="false"
                  placeholder="我&#10;你&#10;媽媽&#10;爸爸"
                ></textarea>
                <p class="helper-text">每行一個字詞。例：天上、小狗、小貓。</p>

                <div class="manager-actions">
                  <button class="secondary-button" id="save-group-button" type="button">儲存課程</button>
                  <button class="ghost-button" id="delete-group-button" type="button">刪除</button>
                </div>
              </div>

              <div class="manager-card preview-card">
                <div class="section-heading">
                  <div>
                    <p class="eyebrow">預覽</p>
                    <h2>本輪字詞</h2>
                  </div>
                  <button class="small-button" id="reset-button" type="button">重新開始</button>
                </div>
                <ul class="word-list" id="word-list"></ul>
              </div>
            </div>
          </section>
        </details>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
