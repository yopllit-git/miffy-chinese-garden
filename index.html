<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>咪菲認字小花園</title>
    <meta name="theme-color" content="#3f8f69" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="咪菲認字小花園" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/app-icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section class="auth-screen" id="auth-screen" aria-label="登入畫面">
      <div class="auth-card">
        <img src="./icons/app-icon-192.png" alt="" class="auth-icon" />
        <p class="eyebrow">咪菲認字小花園</p>
        <div class="auth-loading" id="auth-loading" aria-hidden="true">
          <span class="auth-spinner"></span>
        </div>
        <div class="auth-interactive" id="auth-interactive" hidden>
          <h1>使用 Google 帳號登入</h1>
          <p class="auth-copy">登入後，課程、小孩資料和星星會同步保存。</p>
          <button class="google-button" id="google-signin-button" type="button">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
              <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
              <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
              <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
            </svg>
            使用 Google 帳號登入
          </button>
          <p class="auth-status" id="auth-status">請登入以繼續</p>
        </div>
      </div>
    </section>

    <main class="app-shell" id="app-shell" hidden>
      <header class="app-header">
        <div class="app-title-row">
          <img src="./icons/app-icon-192.png" alt="" class="app-title-icon" />
          <h1 id="app-title">咪菲認字小花園</h1>
        </div>
      </header>

      <nav class="app-nav" aria-label="主要頁面">
        <button class="nav-button active" type="button" data-page="practice" style="--nav-accent: var(--green)">
          <span class="nav-icon" aria-hidden="true">📝</span>
          <span class="nav-label">練習</span>
        </button>
        <button class="nav-button" type="button" data-page="rewards" style="--nav-accent: var(--gold)">
          <span class="nav-icon" aria-hidden="true">🎁</span>
          <span class="nav-label">本週集點</span>
        </button>
        <button class="nav-button" type="button" data-page="leaderboard" style="--nav-accent: var(--coral)">
          <span class="nav-icon" aria-hidden="true">🏆</span>
          <span class="nav-label">排行榜</span>
        </button>
        <button class="nav-button" type="button" data-page="parent" style="--nav-accent: var(--blue)">
          <span class="nav-icon" aria-hidden="true">⚙️</span>
          <span class="nav-label">設定</span>
        </button>
      </nav>

      <section class="learning-panel app-page active" data-page-panel="practice" aria-labelledby="app-title">
        <section class="practice-setup" aria-label="練習設定">
          <div class="practice-controls">
            <label>
              <span>小孩</span>
              <select id="practice-profile-select"></select>
            </label>
            <label>
              <span>課程</span>
              <select id="practice-course-select"></select>
            </label>
          </div>
        </section>

        <section class="prompt-area" aria-live="polite">
          <p class="round-label" id="round-label">第 1 題</p>
          <div class="main-card">
            <p class="instruction" id="instruction">聽一聽，選出你聽到的字。</p>
            <div class="celebration" id="celebration" hidden>
              <p class="confetti" id="confetti" aria-hidden="true">🎉 ✨ 🎊</p>
              <p id="completion-message">恭喜完成第一個練習</p>
            </div>
            <button class="start-button" id="start-button" type="button">開始練習</button>
            <button class="speak-button" id="speak-button" type="button">
              <span aria-hidden="true">▶</span>
              再聽一次
            </button>
            <div class="picture-prompt" id="picture-prompt" hidden></div>
            <div class="character-prompt" id="character-prompt" hidden></div>
          </div>
        </section>

        <section class="choice-grid" id="choice-grid" aria-label="答案選項"></section>

        <footer class="progress-row">
          <div>
            <p class="mini-label">本輪答對</p>
            <p class="score" id="score">0</p>
          </div>
          <div class="progress-track" aria-label="本輪進度">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <button class="secondary-button" id="next-button" type="button" disabled>下一題</button>
        </footer>
      </section>

      <section class="reward-panel app-page" data-page-panel="rewards" aria-labelledby="reward-title" hidden>
        <section class="practice-controls reward-controls" aria-label="集點設定">
          <label>
            <span>小孩</span>
            <select id="reward-profile-select"></select>
          </label>
          <p class="week-summary" id="week-summary">本週 0 / 21 ⭐</p>
        </section>
        <div class="reward-hero">
          <h2 id="reward-title">咪菲的中文集點卡</h2>
        </div>
        <div class="week-grid" id="week-grid" aria-label="本週集點"></div>
      </section>

      <section class="leaderboard-panel app-page" data-page-panel="leaderboard" aria-labelledby="leaderboard-title" hidden>
        <div class="reward-hero">
          <h2 id="leaderboard-title">認字排行榜</h2>
          <p class="leaderboard-note">完成一輪練習且答錯不超過上限就得 1 分</p>
        </div>
        <ol class="leaderboard-list" id="leaderboard-list" aria-label="排行榜"></ol>
        <p class="leaderboard-empty" id="leaderboard-empty" hidden>還沒有人得分，開始練習拿第一分吧！</p>
      </section>

      <section class="parent-panel app-page" data-page-panel="parent" aria-labelledby="parent-title" hidden>
        <header class="settings-head">
          <h2 id="parent-title">設定</h2>
          <p class="settings-context" id="settings-context">管理小孩、課程與字詞</p>
        </header>

        <section class="manager-card picker-card" aria-label="小孩與課程">
          <div class="picker-row">
            <div class="picker-row-head">
              <label class="eyebrow" for="profile-tabs">小孩</label>
              <button class="add-chip" id="add-profile-button" type="button" title="新增小孩" aria-label="新增小孩">＋</button>
            </div>
            <select class="picker-select" id="profile-tabs" aria-label="小孩清單"></select>
          </div>

          <div class="picker-row">
            <div class="picker-row-head">
              <label class="eyebrow" for="group-tabs">課程</label>
              <button class="add-chip" id="add-group-button" type="button" title="新增課程" aria-label="新增課程">＋</button>
            </div>
            <select class="picker-select" id="group-tabs" aria-label="字詞組清單"></select>
          </div>

          <div class="picker-footer">
            <div class="picker-footer-fields">
              <label class="inline-field" for="session-length">
                <span>每次題數</span>
                <input
                  class="text-field small"
                  id="session-length"
                  type="number"
                  min="5"
                  max="30"
                  step="1"
                  inputmode="numeric"
                />
              </label>
              <label class="inline-field" for="max-fails">
                <span>可答錯題數</span>
                <input
                  class="text-field small"
                  id="max-fails"
                  type="number"
                  min="1"
                  max="10"
                  step="1"
                  inputmode="numeric"
                />
              </label>
            </div>
            <span class="group-count" id="group-count">0 / 10</span>
          </div>

          <details class="rename-drawer">
            <summary>重新命名或刪除小孩</summary>
            <div class="rename-row">
              <input class="text-field" id="profile-name" type="text" maxlength="18" placeholder="小孩名稱" />
              <div class="rename-actions">
                <button class="small-button" id="save-profile-button" type="button">儲存名稱</button>
                <button class="ghost-button" id="delete-profile-button" type="button">刪除小孩</button>
              </div>
            </div>
          </details>
        </section>

        <section class="manager-card editor-card" aria-label="編輯課程">
          <h3 class="editor-heading">課程內容</h3>

          <label class="field-label" for="group-name">課程名稱</label>
          <input
            class="text-field"
            id="group-name"
            type="text"
            maxlength="18"
            placeholder="例如：樂樂書第一課"
          />

          <label class="field-label" for="word-editor">字詞（每行一個）</label>
          <textarea
            class="word-editor"
            id="word-editor"
            rows="8"
            spellcheck="false"
            placeholder="我&#10;你&#10;媽媽&#10;爸爸"
          ></textarea>

          <div class="manager-actions">
            <button class="secondary-button" id="save-group-button" type="button">儲存課程</button>
            <button class="ghost-button" id="delete-group-button" type="button">刪除課程</button>
          </div>
        </section>

        <section class="manager-card account-card" aria-label="帳號">
          <button class="ghost-button" id="logout-button" type="button">登出</button>
        </section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
